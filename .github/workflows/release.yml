name: Release
run-name: Soiree ${{ inputs.version }} release by @${{ github.actor }}

# Windows-only release for the Soiree fork. Start it from the Actions tab
# ("Release" > "Run workflow") with a plain semantic version such as 1.0.0.
# The in-app updater reads these GitHub releases and their SHA256SUMS.txt.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 1.0.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: soiree-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      PACKAGE_ROOT: dist
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apply version to manifests
        run: python .github/release/version.py "$VERSION"
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Package app
        run: |
          cargo xtask package
          mkdir release-assets
          echo "ASSET=soiree-$TAG-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_ENV"
      - name: Archive Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PACKAGE_ROOT/*" -DestinationPath "release-assets/$env:ASSET.zip"
          $installer = Get-ChildItem -Path "dist-installer/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/$env:ASSET-Setup.exe"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: soiree-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Publish GitHub release
        run: |
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Soiree $VERSION" \
            --notes "Windows build of Soiree $VERSION, based on Serein. Unsigned: Windows SmartScreen may warn on first start. Unofficial Discord client; using it may violate Discord's Terms of Service."
